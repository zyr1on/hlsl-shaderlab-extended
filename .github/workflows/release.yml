name: Release hlsl_validator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build hlsl_validator (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: hlsl_validator.exe
            asset_name: hlsl_validator-x86_64-windows.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: hlsl_validator
            asset_name: hlsl_validator-x86_64-linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build hlsl_validator
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path hlsl_validator/Cargo.toml

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "hlsl_validator/target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -DestinationPath "${{ matrix.asset_name }}"

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.asset_name }}" -C "hlsl_validator/target/${{ matrix.target }}/release" "${{ matrix.bin_name }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true

  build-wasm:
    name: Build and Package Zed Extension (.wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust & wasm32-wasip2
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build extension.wasm
        run: |
          cargo build --release --target wasm32-wasip2 --manifest-path editors/zed/Cargo.toml

      - name: Package zed-hlsl_shaderlab-general-release.zip
        run: |
          mkdir -p dist/package
          cp target/wasm32-wasip2/release/zed_hlsl_shaderlab.wasm dist/package/extension.wasm
          cp editors/zed/extension.toml dist/package/
          cp -r editors/zed/languages dist/package/
          cd dist/package && zip -r ../../zed-hlsl_shaderlab-general-release.zip .

      - name: Upload Zed Extension Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: zed-hlsl_shaderlab-general-release.zip

  build-vsix:
    name: Build and Package VS Code Extension (.vsix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and Package VSIX
        run: |
          cd editors/vscode
          npm install
          npm run compile
          npx @vscode/vsce package -o ../../vscode-hlsl_shaderlab-general-release.vsix

      - name: Upload VS Code Extension Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: vscode-hlsl_shaderlab-general-release.vsix
