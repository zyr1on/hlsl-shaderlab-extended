name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-extension:
    name: Check Zed WASM Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy

      - name: Cargo Check WASM
        run: cargo check --target wasm32-wasip2 --manifest-path editors/zed/Cargo.toml

      - name: Clippy WASM
        run: cargo clippy --target wasm32-wasip2 --manifest-path editors/zed/Cargo.toml -- -D warnings

  check-vscode:
    name: Check VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compile VS Code Extension
        run: |
          cd editors/vscode
          npm install
          npm run compile

  test-validator:
    name: Test hlsl_validator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check, Clippy and Test hlsl_validator
        working-directory: hlsl_validator
        run: |
          cargo check
          cargo clippy -- -D warnings
          cargo test

